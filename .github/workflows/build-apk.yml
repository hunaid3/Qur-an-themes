name: Build APK and Play bundle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # APK for direct installs, signed with the testing key so each build updates the last.
      - name: Build APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease -PversionCode=$((100 + VERSION_CODE)) --no-daemon --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk QuranThemes.apk

      # Play Store bundle, signed with the private upload key from the repository secrets.
      - name: Build Play bundle (needs the upload-key secrets)
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -z "$UPLOAD_KEYSTORE_B64" ]; then
            echo "::warning::Upload-key secrets are not set, so no Play bundle was built. See README.md, Signing."
            exit 0
          fi
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          RELEASE_KEYSTORE="$RUNNER_TEMP/upload.jks" RELEASE_KEYSTORE_PASSWORD="$UPLOAD_KEYSTORE_PASSWORD" \
          RELEASE_KEY_ALIAS="$UPLOAD_KEY_ALIAS" RELEASE_KEY_PASSWORD="$UPLOAD_KEY_PASSWORD" \
            gradle :app:bundleRelease -PversionCode=$((100 + VERSION_CODE)) --no-daemon --stacktrace 2>&1 | tee -a build.log
          cp app/build/outputs/bundle/release/app-release.aab QuranThemes-play.aab
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Report build errors
        if: failure()
        run: |
          grep -nE "What went wrong|error:|Error:|> |Could not|FAILURE|Exception" build.log | grep -v "^.*> Task" | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: QuranThemes
          path: |
            QuranThemes.apk
            QuranThemes-play.aab
          if-no-files-found: warn
      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Qur'an Themes 1.0 (build ${{ github.run_number }})
          body: |
            QuranThemes.apk: install by opening it on your Android phone (allow installs from this source when asked). Later builds install over this one.
            QuranThemes-play.aab (when present): upload this file to Google Play Console.
          files: |
            QuranThemes.apk
            QuranThemes-play.aab
          fail_on_unmatched_files: false
