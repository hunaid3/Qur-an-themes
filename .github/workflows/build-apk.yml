name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk QuranThemes-draft.apk
      - uses: actions/upload-artifact@v4
        with:
          name: QuranThemes-apk
          path: QuranThemes-draft.apk
      - name: Publish as a release for easy phone download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Qur'an Themes draft build ${{ github.run_number }}
          body: Draft build for testing. Install by opening the APK on your Android phone (allow installs from this source when asked).
          files: QuranThemes-draft.apk
